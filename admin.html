<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crit Happens – Admin</title>
  <style>
    :root {
      --purple: #7c3aed; --purple-dark: #5b21b6; --purple-light: #a78bfa;
      --purple-glow: rgba(124,58,237,0.35);
      --bg: #0d0d14; --bg2: #13131f; --bg3: #1a1a2e;
      --card: #1e1e30; --border: rgba(124,58,237,0.25);
      --text: #e8e8f0; --muted: #9090b0; --white: #ffffff;
      --danger: #ef4444; --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a0a30 0%, var(--bg) 70%);
    }
    .login-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 2.5rem; width: 100%; max-width: 400px; text-align: center;
      box-shadow: 0 20px 60px var(--purple-glow);
    }
    .login-box h1 { font-size: 1.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--white); margin-bottom: 0.5rem; }
    .login-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .login-box input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.75rem 1rem; font-size: 1rem;
      margin-bottom: 1rem; text-align: center; letter-spacing: 0.1em;
    }
    .login-box input:focus { outline: none; border-color: var(--purple); }
    .login-error { color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .btn-primary {
      width: 100%; padding: 0.75rem; border-radius: 8px; font-size: 1rem; font-weight: 700;
      background: var(--purple); color: #fff; border: none; cursor: pointer;
      transition: background 0.2s; box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-primary:hover { background: var(--purple-dark); }
    .back-link { display: block; margin-top: 1.25rem; color: var(--muted); font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: var(--purple-light); }

    /* ADMIN APP */
    #adminApp { display: none; }
    header {
      background: rgba(13,13,20,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header-logo { font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--white); }
    .header-logo span { color: var(--purple-light); font-size: 0.75rem; font-weight: 500; margin-left: 0.5rem; letter-spacing: 0.05em; }
    .header-actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn-sm {
      padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-add { background: var(--purple); color: #fff; }
    .btn-add:hover { background: var(--purple-dark); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--purple-light); color: var(--white); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 2rem; }

    /* STATS */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.25rem; text-align: center;
    }
    .stat-card .num { font-size: 2rem; font-weight: 900; color: var(--white); }
    .stat-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

    /* EVENT TABLE */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .section-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--white); }
    .event-table { width: 100%; border-collapse: collapse; }
    .event-table th {
      text-align: left; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .event-table td {
      padding: 1rem; border-bottom: 1px solid rgba(124,58,237,0.1);
      font-size: 0.9rem; vertical-align: middle;
    }
    .event-table tr:last-child td { border-bottom: none; }
    .event-table tr:hover td { background: rgba(124,58,237,0.05); }
    .event-table-wrap {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .cat-badge {
      font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.6rem;
      border-radius: 20px; border: 1px solid var(--border); color: var(--purple-light);
      white-space: nowrap;
    }
    .past-row td { opacity: 0.5; }
    .empty-state { text-align: center; padding: 3rem; color: var(--muted); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 200; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      padding: 2rem; width: 100%; max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal h2 { font-size: 1.2rem; font-weight: 700; color: var(--white); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.65rem 0.9rem; font-size: 0.9rem;
      font-family: inherit; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: var(--purple);
    }
    .form-group textarea { resize: vertical; min-height: 90px; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 300;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.5rem; font-size: 0.9rem; color: var(--white);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      transform: translateY(100px); opacity: 0; transition: all 0.3s;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: repeat(2,1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Crit Happens</h1>
    <p>Admin Panel — Club Committee Only</p>
    <input type="email" id="passwordInput" placeholder="Email address"
           style="letter-spacing:normal;margin-bottom:0.75rem;"
           onkeydown="if(event.key==='Enter')document.getElementById('passwordInput2').focus()" />
    <input type="password" id="passwordInput2" placeholder="Password"
           onkeydown="if(event.key==='Enter')doLogin()" />
    <p class="login-error" id="loginError">Incorrect password. Try again.</p>
    <button class="btn-primary" onclick="doLogin()">Log In</button>
    <a href="index.html" class="back-link">← Back to website</a>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <header>
    <div class="header-logo">Crit Happens <span>ADMIN</span></div>
    <div class="header-actions">
      <a href="index.html" class="btn-sm btn-ghost" style="text-decoration:none;">View Website</a>
      <button class="btn-sm btn-add" onclick="openModal()">+ Add Event</button>
      <button class="btn-sm btn-ghost" onclick="doLogout()">Log Out</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="statTotal">0</div>
        <div class="label">Total Events</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statUpcoming">0</div>
        <div class="label">Upcoming</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statThisMonth">0</div>
        <div class="label">This Month</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statPast">0</div>
        <div class="label">Past Events</div>
      </div>
    </div>

    <!-- Events Table -->
    <div class="section-header">
      <h2>Events</h2>
      <button class="btn-sm btn-add" onclick="openModal()">+ Add Event</button>
    </div>
    <div class="event-table-wrap">
      <table class="event-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Event</th>
            <th>Category</th>
            <th>Cost</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- EVENT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="modalTitle">Add Event</h2>
    <div class="form-group">
      <label>Event Title *</label>
      <input type="text" id="fTitle" placeholder="e.g. 40K Tournament" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Type</label>
        <select id="fType" onchange="toggleEndDate()">
          <option value="event">Event</option>
          <option value="tournament">Tournament</option>
          <option value="league">League</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="fCategory">
          <option value="wargames">Wargames</option>
          <option value="rpg">RPG &amp; D&amp;D</option>
          <option value="boardgames">Board Games</option>
          <option value="social">Social</option>
          <option value="general">General</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label id="fDateLabel">Date *</label>
        <input type="date" id="fDate" />
      </div>
      <div class="form-group" id="fEndDateGroup" style="display:none;">
        <label>End Date (leagues)</label>
        <input type="date" id="fEndDate" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Cost / Entry (display text)</label>
        <input type="text" id="fCost" placeholder="e.g. £10 entry, or Free" />
      </div>
      <div class="form-group">
        <label>Payment Amount £ <span style="font-weight:400;color:var(--muted);">(optional — enables PayPal button)</span></label>
        <input type="number" id="fPaymentAmount" placeholder="e.g. 10.00" min="0" step="0.01" />
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="fDescription" placeholder="Event details, rules, sign-up info..."></textarea>
    </div>
    <p id="modalError" style="color:var(--danger);font-size:0.85rem;margin-top:-0.5rem;display:none;">Please fill in the required fields.</p>
    <div class="modal-footer">
      <button class="btn-sm btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-sm btn-add" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── SUPABASE CONFIG ──
const SB_URL = 'https://zxrycurzcsiogxwtsuci.supabase.co';
const SB_KEY = 'sb_publishable_97NVhR4oYoOv-reBa1Oiqw_cWPzMl6B';

// ── SESSION ──
let _session = null;

function authHeaders() {
  return {
    apikey: SB_KEY,
    Authorization: `Bearer ${_session ? _session.access_token : SB_KEY}`,
    'Content-Type': 'application/json',
    Prefer: 'return=representation'
  };
}

// ── AUTH ──
async function doLogin() {
  const email    = document.getElementById('passwordInput').value.trim();
  const password = document.getElementById('passwordInput2').value.trim();
  if (!email || !password) return;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  try {
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');
    _session = data;
    sessionStorage.setItem('ch_session', JSON.stringify(data));
    showApp();
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

function doLogout() {
  _session = null;
  sessionStorage.removeItem('ch_session');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminApp').style.display = 'none';
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordInput2').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  loadAndRender();
}

// ── EVENTS CACHE (must be declared before auto-login runs) ──
let _events = [];

// Restore session on page load
const _stored = sessionStorage.getItem('ch_session');
if (_stored) { _session = JSON.parse(_stored); showApp(); }

// ── SUPABASE CRUD ──
function toRow(e) {
  return {
    title:          e.title,
    type:           e.type           || 'event',
    category:       e.category       || 'general',
    date:           e.date,
    end_date:       e.endDate        || null,
    description:    e.description    || null,
    cost:           e.cost           || null,
    payment_amount: (e.paymentAmount != null && e.paymentAmount !== '') ? parseFloat(e.paymentAmount) : null
  };
}
function fromRow(r) {
  return {
    id:            r.id,
    title:         r.title,
    type:          r.type,
    category:      r.category,
    date:          r.date,
    endDate:       r.end_date,
    description:   r.description,
    cost:          r.cost,
    paymentAmount: r.payment_amount
  };
}

async function fetchEvents() {
  const res = await fetch(`${SB_URL}/rest/v1/events?select=*&order=date.asc`, { headers: authHeaders() });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return (await res.json()).map(fromRow);
}

async function insertEvent(e) {
  const res = await fetch(`${SB_URL}/rest/v1/events`, {
    method: 'POST', headers: authHeaders(), body: JSON.stringify(toRow(e))
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return fromRow((await res.json())[0]);
}

async function updateEvent(id, e) {
  const res = await fetch(`${SB_URL}/rest/v1/events?id=eq.${id}`, {
    method: 'PATCH', headers: authHeaders(), body: JSON.stringify(toRow(e))
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

async function deleteEventFromDB(id) {
  const res = await fetch(`${SB_URL}/rest/v1/events?id=eq.${id}`, {
    method: 'DELETE', headers: authHeaders()
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

// ── RENDER ──
const CAT = { wargames:'Wargames', rpg:'RPG & D&D', boardgames:'Board Games', social:'Social', general:'General' };
const TYPE = { league:'League', tournament:'Tournament', event:'Event' };
const TYPE_STYLE = { league:'background:#1d4ed8;color:#fff;', tournament:'background:#7c3aed;color:#fff;', event:'background:#065f46;color:#fff;' };
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(d) {
  return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}

async function loadAndRender() {
  document.getElementById('eventsTableBody').innerHTML = '<tr><td colspan="5" class="empty-state">Loading…</td></tr>';
  try {
    _events = await fetchEvents();
    renderAll();
  } catch(e) {
    showToast('⚠ Could not load events: ' + e.message);
    document.getElementById('eventsTableBody').innerHTML = '<tr><td colspan="5" class="empty-state">Failed to load events.</td></tr>';
  }
}

function renderAll() {
  const events = [..._events].sort((a,b) => b.date.localeCompare(a.date));
  const now = new Date(new Date().setHours(0,0,0,0));
  const upcoming = events.filter(e => new Date((e.endDate||e.date)+'T00:00:00') >= now);
  const past     = events.filter(e => new Date((e.endDate||e.date)+'T00:00:00') < now);
  const thisMonth = upcoming.filter(e => {
    const d = new Date(e.date+'T00:00:00');
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  document.getElementById('statTotal').textContent = events.length;
  document.getElementById('statUpcoming').textContent = upcoming.length;
  document.getElementById('statThisMonth').textContent = thisMonth.length;
  document.getElementById('statPast').textContent = past.length;

  const tbody = document.getElementById('eventsTableBody');
  if (!events.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No events yet. Click "+ Add Event" to create one.</td></tr>';
    return;
  }
  tbody.innerHTML = events.map(e => {
    const isPast = new Date((e.endDate||e.date)+'T00:00:00') < now;
    const dateLabel = e.type === 'league' && e.endDate
      ? `${formatDate(e.date)} → ${formatDate(e.endDate)}`
      : formatDate(e.date);
    return `
      <tr class="${isPast?'past-row':''}">
        <td style="white-space:nowrap;font-size:0.82rem;color:${isPast?'var(--muted)':'var(--text)'};">${dateLabel}</td>
        <td>
          <div style="font-weight:600;color:var(--white);">${escHtml(e.title)}</div>
          ${e.description ? `<div style="font-size:0.8rem;color:var(--muted);margin-top:0.2rem;">${escHtml(e.description.substring(0,80))}${e.description.length>80?'…':''}</div>` : ''}
        </td>
        <td>
          ${e.type ? `<span style="font-size:0.7rem;font-weight:800;padding:0.15rem 0.55rem;border-radius:20px;${TYPE_STYLE[e.type]||''}margin-right:4px;">${TYPE[e.type]||e.type}</span>` : ''}
          <span class="cat-badge">${CAT[e.category]||'General'}</span>
        </td>
        <td style="font-size:0.85rem;color:var(--muted);">${escHtml(e.cost||'—')}</td>
        <td>
          <div style="display:flex;gap:0.5rem;">
            <button class="btn-sm btn-ghost" onclick="editEvent(${e.id})">Edit</button>
            <button class="btn-sm btn-danger" onclick="deleteEvent(${e.id})">Delete</button>
          </div>
        </td>
      </tr>`;
  }).join('');
}

// ── MODAL ──
let editingId = null;

function toggleEndDate() {
  const isLeague = document.getElementById('fType').value === 'league';
  document.getElementById('fEndDateGroup').style.display = isLeague ? 'block' : 'none';
  document.getElementById('fDateLabel').textContent = isLeague ? 'Start Date *' : 'Date *';
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Edit Event' : 'Add Event';
  document.getElementById('modalError').style.display = 'none';
  if (id) {
    const e = _events.find(ev => ev.id === id);
    if (e) {
      document.getElementById('fTitle').value = e.title || '';
      document.getElementById('fType').value = e.type || 'event';
      document.getElementById('fDate').value = e.date || '';
      document.getElementById('fEndDate').value = e.endDate || '';
      document.getElementById('fCategory').value = e.category || 'general';
      document.getElementById('fCost').value = e.cost || '';
      document.getElementById('fPaymentAmount').value = (e.paymentAmount != null) ? e.paymentAmount : '';
      document.getElementById('fDescription').value = e.description || '';
    }
  } else {
    document.getElementById('fTitle').value = '';
    document.getElementById('fType').value = 'event';
    document.getElementById('fDate').value = '';
    document.getElementById('fEndDate').value = '';
    document.getElementById('fCategory').value = 'general';
    document.getElementById('fCost').value = '';
    document.getElementById('fPaymentAmount').value = '';
    document.getElementById('fDescription').value = '';
  }
  toggleEndDate();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 50);
}
function editEvent(id) { openModal(id); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId = null; }
function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

async function saveEvent() {
  const title = document.getElementById('fTitle').value.trim();
  const date  = document.getElementById('fDate').value;
  if (!title || !date) { document.getElementById('modalError').style.display = 'block'; return; }

  const eventData = {
    title, date,
    type:          document.getElementById('fType').value,
    endDate:       document.getElementById('fEndDate').value || null,
    category:      document.getElementById('fCategory').value,
    cost:          document.getElementById('fCost').value.trim(),
    paymentAmount: document.getElementById('fPaymentAmount').value.trim() !== '' ? document.getElementById('fPaymentAmount').value.trim() : null,
    description:   document.getElementById('fDescription').value.trim()
  };

  closeModal();
  showToast('Saving…');
  try {
    if (editingId) {
      await updateEvent(editingId, eventData);
    } else {
      await insertEvent(eventData);
    }
    await loadAndRender();
    showToast(editingId ? '✓ Event updated' : '✓ Event added');
  } catch(e) {
    showToast('⚠ Save failed: ' + e.message);
  }
}

async function deleteEvent(id) {
  if (!confirm('Delete this event? This cannot be undone.')) return;
  showToast('Deleting…');
  try {
    await deleteEventFromDB(id);
    await loadAndRender();
    showToast('✓ Event deleted');
  } catch(e) {
    showToast('⚠ Delete failed: ' + e.message);
  }
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
